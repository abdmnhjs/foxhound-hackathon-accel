[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foxhound-data"
version = "0.1.0"
description = "Deterministic feedback pipeline for Foxhound"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "jsonschema[format]>=4.23,<5",
]

[project.scripts]
foxhound-data = "foxhound_data.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/foxhound_data"]
